<style>

button:disabled{opacity:.5}#switchBtn{color:#184963;background:transparent;border:1px solid var(--line);margin-left:8px}
#status{font-size:13px;color:var(--muted);min-height:22px;margin-top:15px}

<body><main class="wrap"><header class="head"><h1>Shadowing</h1><p class="lead">純網頁雙語閱讀：全書目錄、前言、本書使用方法、第 1 章（前半與續篇）及七步驟。日文、繁中與左右對照可切換。</p></header><section class="card"><div class="pills"><span>目錄</span><span>前言</span><span>七步驟</span></div><nav aria-label="已上線教材"><a href="./#toc-p1">閱讀目錄</a> · <a href="./?book=preface#preface-p6">閱讀前言</a> · <a href="./?book=guide#guide">本書使用方法</a> · <a href="./?book=chapter1#chapter-1">第 1 章前半</a> · <a href="./?book=chapter1b#listening">第 1 章續篇</a> · <a href="./?book=steps#step-1">閱讀七步驟</a></nav><button class="btn" id="openBtn" type="button">Google 登入</button><button class="btn ghost" id="switchBtn" type="button" hidden>切換帳號</button><div id="status" class="status" role="status"></div></section></main>
<script>
"use strict";
const CLIENT_ID="57818954523-lfovhnonguj7nkq6hh030fs50lrmrouu.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive.readonly";
const TOKEN_KEY="hanami-kyoto-google-token-v3";
const BOOKS={toc:"1M9-IoCUbyvxFHEp9EjoD22NR60lkQaNG",preface:"1G4adCcGVMl8DcHrrvsQuZ7agQ9QsygNl",prefaceEnd:"1ZD4vXm5Njer9pUmY4u6NpqsQ-4_zJIf4",guide:"1FiKQ2P3iz1gTcxtsZC4izG7Fgkd2ss0F",chapter1:"1ck6WIjhkUdhnTFWlK3xnWLlQvpYktEyh",chapter1Continued:"1OMhRpj6W_XhXrp4GJbMFPHEIRoXNFpjZ",chapter1b:"1lU8aAsawSdpgZMvzcrSASA_6GEfORaqZ",steps:"10JdhNj1ynPOTVEe5Nr9OwkkQfnqmlzfk"};
const requestedBook=()=>{const b=new URLSearchParams(location.search).get("book");return b==="chapter1b"?"chapter1b":b==="chapter1"?"chapter1":b==="guide"?"guide":b==="preface"?"preface":b==="steps"||/^#step-[1-7](?:\b|$)/.test(location.hash)?"steps":"toc"};
const openBtn=document.getElementById("openBtn");
const switchBtn=document.getElementById("switchBtn");
const statusBox=document.getElementById("status");
let tokenClient=null;
function status(msg,loading=false){statusBox.textContent=msg;if(loading)statusBox.innerHTML='<span class="spinner"></span>'+msg}
function saveToken(r){const item={access_token:r.access_token,expires_at:Date.now()+Number(r.expires_in||3600)*1000};sessionStorage.setItem(TOKEN_KEY,JSON.stringify(item));return item}
function savedToken(){try{const item=JSON.parse(sessionStorage.getItem(TOKEN_KEY)||"null");if(item?.access_token&&Date.now()<item.expires_at-120000)return item}catch(e){}sessionStorage.removeItem(TOKEN_KEY);return null}
function login(msg){openBtn.hidden=false;openBtn.disabled=false;switchBtn.hidden=false;status(msg||"請使用有權限的 Google 帳號授權。")}

function renderSimpleWebBook(html,selected){
 // Strip the original page scans before HTML parsing and rendering.
 html=html.replace(/<details class="scans">[\s\S]*?<\/details>/g,"");
 const doc=new DOMParser().parseFromString(html,"text/html");
 doc.querySelectorAll('.scans,.scans-grid,.page-bottom,.source-title,.chapter-tag,.hero .eyebrow').forEach(el=>el.remove());
 doc.querySelectorAll('a[href*="drive.google.com/file/d/1Zi-K01V8ZKP1DzjmrpszZmP9KGNdii53"]').forEach(el=>el.remove());
 doc.querySelectorAll('.page-head p,.unit-head p').forEach(el=>{if(/PDF|原書|頁/.test(el.textContent))el.remove()});
 doc.querySelectorAll('p.note,p.hint,.original p,.translation p').forEach(el=>{
  if(/請參閱下方原頁影像|請參照本 STEP 下方原頁影像|参照.*原頁/.test(el.textContent)){
   el.textContent="此處的發音／語調標記仍待校對。";
  }
 });
 const heroParagraphs=[...doc.querySelectorAll(".hero p")];
 if(heroParagraphs.length){const summary=heroParagraphs[0];summary.classList.remove("updated");summary.textContent=selected==="toc"?"全書日中雙語目錄":selected==="preface"?"完整前言 · 日中逐段對照":selected==="guide"?"本書使用方法 · 日中逐段對照":selected==="chapter1"?"第 1 章 · 英語學習、聽力與七步驟":selected==="chapter1b"?"第 1 章 · 聽力與影子跟讀":"第 2 章 · 七步驟日中對照與英文練習";heroParagraphs.slice(1).forEach(p=>p.remove())}
 const units=[...doc.querySelectorAll("main .unit")];
 if(selected==="toc"||selected==="preface"){
  const first=units[0],body=first?.querySelector(".contents");
  if(first&&body){
   if(selected==="preface"){
    for(let i=1;i<units.length;i++){
     const prior=units[i-1].querySelector(".contents > .pair:last-child");
     const next=units[i].querySelector(".contents > .pair:first-child");
     if(prior?.classList.contains("para")&&next?.classList.contains("para")){
      for(const side of ["original","translation"]){
       const a=prior.querySelector("."+side),b=next.querySelector("."+side);
       if(a&&b){const left=a.textContent,right=b.textContent;a.textContent=side==="translation"&&left.endsWith("的人……")&&right.startsWith("的人，")?left.slice(0,-2)+right.slice(2):left+right}
      }
      next.remove();
     }
    }
   }
   for(const extra of units.slice(1)){
    const inner=extra.querySelector(".contents");
    if(inner){
     const marker=doc.createElement("span");marker.id=extra.id;marker.className="reading-anchor";
     body.appendChild(marker);
     while(inner.firstChild)body.appendChild(inner.firstChild);
    }
    extra.remove();
   }
   const heading=first.querySelector(".page-head h2");
   if(heading)heading.textContent=selected==="toc"?"全書目錄":"前言";
  }
  doc.querySelectorAll(".toc-nav").forEach(el=>el.remove());
 }
 if(selected==="steps"){
  doc.querySelectorAll(".note").forEach(el=>{
   if(/原頁影像/.test(el.textContent))el.textContent="原書部分發音標記仍待轉成網頁文字。";
  });
 }
 if(selected==="toc"){
  doc.querySelectorAll(".pair").forEach(pair=>{
   const jp=pair.querySelector(".original")?.textContent?.trim()||"";
   let hash="";
   if(jp==="この本の使い方")hash="guide";
   if(jp.startsWith("特別付録 追加練習教材"))hash="extra";
   if(jp==="はじめに")hash="preface";
   if(hash){
    const a=doc.createElement("a");
    a.href=hash==="preface"?"./?book=preface#preface-p6":"./?book=guide#"+hash;
    a.textContent="閱讀 ↗";a.style.cssText="display:inline-block;margin-left:9px;font-size:11px;text-decoration:underline";
    pair.querySelector(".translation")?.appendChild(a);
   }
  });
 }
 if(selected==="toc"){
  doc.querySelectorAll(".pair").forEach(pair=>{
   const label=pair.querySelector(".original")?.textContent?.trim()||"";
   if(label.startsWith("第1章")&&label.includes("シャドーイング")){
    const a=doc.createElement("a");a.href="./?book=chapter1#chapter-1";a.textContent="閱讀 ↗";a.style.cssText="display:inline-block;margin-left:9px;font-size:11px;text-decoration:underline";
    pair.querySelector(".translation")?.appendChild(a);
   }
  });
 }
 if(selected==="chapter1"){
  const nav=doc.querySelector(".nav");
  if(nav){const a=doc.createElement("a");a.href="./?book=chapter1b#listening";a.textContent="接續：聽力與影子跟讀 →";nav.appendChild(a)}
 }
 if(selected==="chapter1b"){
  const nav=doc.querySelector(".nav");
  if(nav){const a=doc.createElement("a");a.href="./?book=chapter1#chapter-1";a.textContent="← 第 1 章前半";nav.prepend(a)}
 }
 if(selected==="guide"){
  const nav=doc.querySelector(".nav");
  if(nav){const a=doc.createElement("a");a.href="./?book=chapter1#chapter-1";a.textContent="接續：第 1 章 →";nav.appendChild(a)}
 }
 if(selected==="preface"){
  const links=doc.querySelector(".hero .links");
  if(links){const a=doc.createElement("a");a.href="./?book=guide#guide";a.textContent="接續：本書使用方法 →";links.appendChild(a)}
 }
 if(selected==="toc"){
  const links=doc.querySelector(".hero .links");
  if(links&&!links.querySelector('a[href*="book=preface"]')){
   const a=doc.createElement("a");a.href="./?book=preface#preface-p6";a.textContent="閱讀前言 →";links.prepend(a);
  }
 }
 const footer=doc.querySelector("footer");
 if(footer)footer.textContent=selected==="toc"?"目錄 · 前言與七步驟可從上方連結閱讀":selected==="preface"?"前言 · 已完整收錄":selected==="guide"?"本書使用方法與特別附錄 · 完":selected==="chapter1"?"第 1 章 · 已收錄英語學習架構、聽力、影子跟讀及七步驟；下一節每日 30 分鐘訓練":selected==="chapter1b"?"第 1 章 · 聽力與影子跟讀":"七步驟試行版 · 部分發音標記與翻譯仍待校訂";
 const cleanStyle=doc.createElement("style");cleanStyle.id="simplified-web-reader";
 cleanStyle.textContent=':root{--bg:#fff;--paper:#fff;--ink:#202938;--blue:#334155;--accent:#334155;--line:#e5e7eb;--muted:#667085;--soft:#f8fafc} body{background:#fff!important;color:#202938!important} header.hero,.hero{background:#fff!important;padding:18px 15px 12px!important;border-bottom:1px solid #e5e7eb} .hero h1{font-size:clamp(23px,4vw,30px)!important;letter-spacing:0!important;line-height:1.4!important;margin:0 0 6px!important} .hero p{font-size:13px!important;line-height:1.65!important;color:#667085!important} .hero .links{margin:8px 0 0!important;gap:14px!important} .hero .links a{font-size:13px!important;color:#34495e!important} .hero .updated,.hero .eyebrow,.breadcrumbs{display:none!important} .bar,.modebar{box-shadow:none!important;border-color:#e5e7eb!important} .layout{display:block!important;max-width:980px!important;margin:auto!important;padding:12px 12px 40px!important} .toc-nav{display:none!important} .unit{box-shadow:none!important;border:0!important;border-radius:0!important;overflow:visible!important;margin:0 0 20px!important} .page-head,.unit-head{background:#fff!important;border:0!important;padding:9px 5px 8px!important} .page-head h2,.unit-head h2{font-size:21px!important;color:#293548!important;letter-spacing:0!important} .contents{padding:2px 3px!important} .unit-section{padding:18px 8px!important} .pair>.original{color:#304255!important;border-right-color:#e5e7eb!important} .pair>.translation{color:#293548!important} .pair.chapter,.pair.heading,.pair.column{background:#f8fafc!important;border-radius:3px!important} .pair{border-bottom-color:#eceff2!important} .stepnav:hover{background:#f8fafc!important} .toc{position:static!important;display:flex!important;gap:5px!important;overflow-x:auto!important;white-space:nowrap!important;box-shadow:none!important;border:0!important;border-bottom:1px solid #e5e7eb!important;border-radius:0!important;margin-bottom:13px!important;padding:7px!important} .toc-head{display:none!important} .stepnav{flex:0 0 auto!important;padding:7px 10px!important} .stepnav small{display:none!important} .nstep,.stepno{background:#f1f5f9!important;color:#334155!important} .script-card,.english-phrase{background:#f9fafb!important;border-color:#e5e7eb!important} .scans,.page-bottom,.source-title{display:none!important} .reading-anchor{display:block;position:relative;scroll-margin-top:95px} footer.foot,footer{border-top:1px solid #e5e7eb;color:#667085!important;max-width:980px;margin:auto!important;padding:17px 15px 45px!important;text-align:center;font-size:12px} @media(max-width:800px){.layout{padding:8px 10px 30px!important}.unit-section{padding:12px 3px!important}.toc{margin-bottom:13px!important;overflow-x:auto!important}.hero{padding:15px 12px!important}}';
 doc.head.appendChild(cleanStyle);
 return "<!doctype html>\n"+doc.documentElement.outerHTML;
}

async function openBook(token){
 status("正在從 Google Drive 下載私人教材…",true);
 const selected=requestedBook();
 const res=await fetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(BOOKS[selected])+"?alt=media",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
 if(res.status===401)throw Error("TOKEN_EXPIRED");
 if(res.status===403)throw Error("NO_ACCESS");
 if(!res.ok)throw Error("DRIVE_"+res.status);
 let book=await res.text();
 if(selected==="toc"?!book.includes('id="toc-p5"')||!book.includes('data-mode="parallel"'):selected==="preface"?!book.includes('id="preface-p8"')||!book.includes('data-mode="parallel"'):selected==="guide"?!book.includes('id="extra"')||!book.includes('id="audio"')||!book.includes('data-mode="parallel"'):selected==="chapter1"?!book.includes('id="chapter-1"')||!book.includes('learning-model')||!book.includes('data-mode="parallel"'):selected==="chapter1b"?!book.includes('id="seven"')||!book.includes('id="listening"')||!book.includes('id="deliberate"')||!book.includes('id="why"')||!book.includes('STEP 07')||!book.includes('data-mode="parallel"'):!book.includes('id="step-7"')||!book.includes('data-mode="parallel"')||!book.includes('English Script'))throw Error("INVALID_BOOK");
 if(selected==="preface"){
  // Both source segments remain private; join them in the browser after authorized reads.
  const more=await fetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(BOOKS.prefaceEnd)+"?alt=media",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
  if(more.status===401)throw Error("TOKEN_EXPIRED");
  if(more.status===403)throw Error("NO_ACCESS");
  if(!more.ok)throw Error("DRIVE_"+more.status);
  const addition=await more.text();
  if(!addition.includes('id="preface-p12"')||!addition.includes('data-mode="parallel"'))throw Error("INVALID_BOOK");
  const firstDoc=new DOMParser().parseFromString(book,"text/html");
  const lastDoc=new DOMParser().parseFromString(addition,"text/html");
  const target=firstDoc.querySelector("main");
  const sections=[...lastDoc.querySelectorAll("main .unit")];
  if(!target||sections.length!==4)throw Error("INVALID_BOOK");
  sections.forEach(node=>target.appendChild(firstDoc.importNode(node,true)));
  book="<!doctype html>\n"+firstDoc.documentElement.outerHTML;
 }

 if(selected==="chapter1"){
  // Authorized composite reader: two separate private sources, one continuous chapter.
  const more=await fetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(BOOKS.chapter1Continued)+"?alt=media",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
  if(more.status===401)throw Error("TOKEN_EXPIRED");
  if(more.status===403)throw Error("NO_ACCESS");
  if(!more.ok)throw Error("DRIVE_"+more.status);
  const addition=await more.text();
  if(!addition.includes('id="c1-listening"')||!addition.includes('id="c1-maximize"')||!addition.includes('class="pair step"'))throw Error("INVALID_BOOK");
  const doc1=new DOMParser().parseFromString(book,"text/html");
  const doc2=new DOMParser().parseFromString(addition,"text/html");
  const target=doc1.querySelector("main"),sections=[...doc2.querySelectorAll("main section.unit")];
  if(!target||sections.length!==4)throw Error("INVALID_BOOK");
  sections.forEach(node=>target.appendChild(doc1.importNode(node,true)));
  const css=doc2.querySelector("head style");
  if(css)doc1.head.appendChild(doc1.importNode(css,true));
  const readerNav=doc1.querySelector(".nav");
  if(readerNav){
   for(const [id,label] of [["c1-listening","掌握聽力"],["c1-deliberate","有效訓練"],["c1-why","影子跟讀原理"],["c1-maximize","七步驟總覽"]]){
    const a=doc1.createElement("a");a.href="#"+id;a.textContent=label;readerNav.appendChild(a);
   }
  }
  book="<!doctype html>\n"+doc1.documentElement.outerHTML;
 }
 // Correct cross-book links before loading a private book; a query change forces a full navigation.
 if(selected==="toc")book=book.replaceAll('https://wesleychen310.github.io/osaka2026/learning/shadowing-reading/#step-','https://wesleychen310.github.io/osaka2026/learning/shadowing-reading/?book=steps#step-');
 
 // Public shell contains navigation only; both books and all translations remain private in Drive.
 if(selected==="steps"){
  const integrityNotice='<div role="note" style="background:#fff8e9;border-bottom:1px solid #e7d6ad;color:#614b1f;padding:10px 17px;text-align:center;font:13px/1.7 -apple-system,BlinkMacSystemFont,sans-serif">既有 STEP 01–07 試行版｜部分文字與發音標記待校訂。 <a href="./#toc-p1" style="color:#184964">返回已校對的雙語目次</a></div>';
  book=book.replace('<header class="hero">',integrityNotice+'<header class="hero">');
 }
 book=renderSimpleWebBook(book,selected);
 document.open();document.write(book);document.close();
 if(location.hash){const id=location.hash.slice(1);setTimeout(()=>document.getElementById(id)?.scrollIntoView({block:"start"}),160);}
}
function init(){
 if(tokenClient)return true;if(!window.google?.accounts?.oauth2)return false;
 tokenClient=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,scope:SCOPE,
  callback:async r=>{
   if(r.error){login("Google 授權未完成。");return}
   try{const token=saveToken(r);await window.HanamiAuth?.remember(token.access_token);await openBook(token.access_token)}
   catch(e){sessionStorage.removeItem(TOKEN_KEY);login(e.message==="NO_ACCESS"?"這個 Google 帳號沒有私人教材存取權限。":e.message==="TOKEN_EXPIRED"?"授權已過期，請重新登入。":"私人教材載入失敗，請再試一次。")}
  },
  error_callback:()=>login("瀏覽器需要你點選登入按鈕。")
 });return true;
}
function request(change=false){if(!init())return false;try{if(window.HanamiAuth)window.HanamiAuth.request(tokenClient,change);else tokenClient.requestAccessToken({prompt:change?"select_account":""});return true}catch(e){return false}}
openBtn.addEventListener("click",()=>{openBtn.disabled=true;status("正在開啟 Google 授權…",true);if(!request())login("Google 授權元件尚未就緒，請稍後再試。")});
switchBtn.addEventListener("click",()=>{sessionStorage.removeItem(TOKEN_KEY);window.HanamiAuth?.forget();openBtn.disabled=true;status("正在切換 Google 帳號…",true);if(!request(true))login("請再按一次登入。")});
async function boot(){
 const t=savedToken();if(t){try{await window.HanamiAuth?.remember(t.access_token);await openBook(t.access_token);return}catch(e){sessionStorage.removeItem(TOKEN_KEY);if(e.message==="NO_ACCESS"){login("這個 Google 帳號沒有私人教材權限。");return}}}
 const until=Date.now()+6000;while(Date.now()<until&&!window.google?.accounts?.oauth2)await new Promise(r=>setTimeout(r,100));
 if(!init()){login("Google 登入元件載入失敗，請重新整理。");return}
 status("正在嘗試沿用既有 Google 授權…",true);
 if(!request())login("請按一次 Google 登入。");
 setTimeout(()=>{if(document.getElementById("openBtn"))login("若尚未出現 Google 授權視窗，請按一下登入按鈕。")},4000);
}
boot();
</script>
