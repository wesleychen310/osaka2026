<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>超級筆記</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;background:#f5f7f9;color:#1d2731}
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);background:#fff;border:1px solid #dfe5ea;border-radius:22px;padding:24px;box-shadow:0 14px 36px rgba(27,47,62,.08)}
.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;color:#1f5d84}
h1{margin:8px 0 8px;font-size:34px;letter-spacing:-.04em;color:#173e5b}
p{margin:0 0 16px;color:#68737f;line-height:1.65}
button{width:100%;border:0;border-radius:14px;padding:13px 16px;background:#173e5b;color:#fff;font:inherit;font-weight:820;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.status{margin-top:13px;padding:11px 13px;border-radius:13px;background:#edf5f9;color:#1f5d84;font-size:13px;white-space:pre-wrap}
.back{display:inline-block;margin-top:15px;color:#68737f;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main id="gate" class="gate">
  <section class="card">
    <div class="eyebrow">PRIVATE · PA / ATPA</div>
    <h1>超級筆記</h1>
    <p>正在確認 Google 授權。授權有效時會直接載入私人 Google Drive 版本並接管全頁。</p>
    <button id="loginBtn" type="button" hidden>使用 Google 帳號繼續</button>
    <div id="status" class="status">正在確認授權…</div>
    <a class="back" href="../">← 回學習入口</a>
  </section>
</main>
<script>
const CLIENT_ID='57818954523-lfovhnonguj7nkq6hh030fs50lrmrouu.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive.readonly';
const FILE_ID='1Gmf5EKGCxqR0iE-MwLfNrZM6DWNVdxTa';
const SESSION_KEY='super-notes-google-oauth-v2';

const loginBtn=document.getElementById('loginBtn');
const statusBox=document.getElementById('status');
let tokenClient=null;
let accessToken='';

function setStatus(text){statusBox.textContent=text}
function clearSession(){accessToken='';sessionStorage.removeItem(SESSION_KEY)}
function saveSession(resp){
  const expiresIn=Math.max(0,Number(resp.expires_in||3600)-60);
  sessionStorage.setItem(SESSION_KEY,JSON.stringify({
    access_token:resp.access_token||'',
    expires_at:Date.now()+expiresIn*1000
  }));
}
function restoreSession(){
  try{
    const raw=sessionStorage.getItem(SESSION_KEY);
    if(!raw)return false;
    const s=JSON.parse(raw);
    if(!s?.access_token||!s?.expires_at||Date.now()>=Number(s.expires_at)){
      clearSession(); return false;
    }
    accessToken=s.access_token; return true;
  }catch{clearSession();return false}
}
function initGoogle(){
  if(!window.google?.accounts?.oauth2)return false;
  if(!tokenClient){
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,
      scope:SCOPE,
      prompt:'',
      callback:async resp=>{
        if(resp.error){
          loginBtn.hidden=false; loginBtn.disabled=false;
          setStatus('Google 授權失敗：'+resp.error); return;
        }
        accessToken=resp.access_token||'';
        if(accessToken)saveSession(resp);
        await loadPrivateHtml();
      },
      error_callback:()=>{
        loginBtn.hidden=false; loginBtn.disabled=false;
        setStatus('需要 Google 授權才能讀取私人超級筆記。');
      }
    });
  }
  return true;
}
async function loadPrivateHtml(){
  try{
    setStatus('正在從私人 Google Drive 載入超級筆記…');
    const res=await fetch(
      'https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(FILE_ID)+'?alt=media',
      {headers:{Authorization:'Bearer '+accessToken},cache:'no-store'}
    );
    if(res.status===401){
      clearSession();
      loginBtn.hidden=false; loginBtn.disabled=false;
      setStatus('Google 授權已到期，按一次即可重新取得授權。');
      return;
    }
    if(!res.ok)throw new Error('Google Drive HTTP '+res.status);
    const html=await res.text();
    if(!/^\s*(<!doctype html|<html)/i.test(html))throw new Error('Drive 檔案不是完整 HTML');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    loginBtn.hidden=false; loginBtn.disabled=false;
    setStatus('載入失敗：'+(e?.message||String(e)));
  }
}
loginBtn.addEventListener('click',()=>{
  loginBtn.disabled=true;
  setStatus('正在取得 Google 授權…');
  if(!initGoogle()){
    loginBtn.disabled=false;
    setStatus('Google 登入元件仍在載入，請再按一次。');
    return;
  }
  tokenClient.requestAccessToken({prompt:''});
});
async function boot(){
  if(restoreSession()){await loadPrivateHtml();return}
  // 直接進此網址且沒有本頁 session 時，顯示單一登入按鈕；
  // 避免瀏覽器阻擋非使用者手勢觸發的 OAuth popup。
  loginBtn.hidden=false;
  setStatus('按一次即可開啟超級筆記；已授權過的帳號不會被強制重新 consent。');
}
boot();
</script>
</body>
</html>
