<style>
:root{--bg:#f5f2ea;--paper:#fffdf8;--ink:#202a31;--muted:#69747b;--line:#dedbd1;--accent:#184d66;--accent2:#7b4f2b;--shadow:0 18px 50px rgba(35,45,52,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;background:linear-gradient(180deg,#e9f0f2 0,#f5f2ea 430px);color:var(--ink)}
.wrap{max-width:980px;margin:auto;padding:clamp(28px,7vw,72px) 16px 64px}
.eyebrow{font-size:12px;font-weight:850;letter-spacing:.13em;color:var(--accent)}
h1{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:clamp(36px,7vw,60px);line-height:1.04;letter-spacing:-.045em;margin:10px 0;color:#173f52}
.dek{margin:0;max-width:720px;color:var(--muted);font-size:15px;line-height:1.8}
.rule{height:1px;background:var(--line);margin:28px 0 22px}
.section-title{font-size:13px;font-weight:850;letter-spacing:.08em;color:#53636c;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}
.chapter{display:block;text-decoration:none;text-align:left;width:100%;border:1px solid var(--line);background:rgba(255,253,248,.96);border-radius:22px;padding:22px;box-shadow:var(--shadow);color:inherit;transition:transform .15s ease,box-shadow .15s ease}
.chapter:hover{transform:translateY(-1px)}.chapter:active{transform:scale(.995)}
.num{font-family:Georgia,serif;font-size:44px;line-height:1;color:#b9c4c9;display:block;margin-bottom:12px}
.chapter h2{margin:0 0 4px;font-size:24px;color:#173f52;letter-spacing:-.02em}
.en{font-family:Georgia,serif;font-size:16px;color:var(--accent2);margin-bottom:10px}
.meta{font-size:13px;color:var(--muted);line-height:1.65}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#fff;color:#667078}
.open{display:block;margin-top:18px;color:var(--accent);font-weight:850;font-size:14px}
.foot{margin-top:22px;font-size:12px;color:#7b858b;line-height:1.7}.back{color:var(--muted);text-decoration:none}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(440px,100%);background:rgba(255,253,248,.98);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.panel h1{font-family:inherit;font-size:27px;letter-spacing:-.02em;margin:7px 0 8px}.panel p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
button{width:100%;margin-top:18px;border:0;border-radius:15px;padding:13px 16px;background:#173e5b;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.5}
.status{margin-top:13px;font-size:12px;color:var(--muted);min-height:20px}.spinner{width:18px;height:18px;border:2px solid #dce5ea;border-top-color:#58798e;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-4px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:620px){.wrap{padding:28px 12px 44px}.chapter{padding:18px;border-radius:18px}}
#switchBtn{width:100%;margin-top:8px;background:transparent;color:var(--accent);border:1px solid var(--line);padding:10px;font-weight:700}#switchBtn[hidden]{display:none}

.bridge-home{max-width:1080px}.bridge-home h1{font-size:clamp(31px,6vw,52px);margin-bottom:13px}.bridge-home .dek{max-width:850px;line-height:1.75}
.bridge-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:23px}.bridge-meta span{font-size:12px;color:#486372;border:1px solid #cad9e0;border-radius:100px;padding:5px 10px;background:#fff}
.bridge-rule{height:1px;background:#d5dfe4;margin:24px 0 18px}.bridge-guide{font-size:14px;color:#53646c;line-height:1.85;margin-bottom:22px}
.bridge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.bridge-card{background:#fff;border:1px solid #dbe3e8;border-radius:17px;overflow:hidden;box-shadow:0 8px 24px rgba(28,49,63,.045)}
.bridge-card-head{padding:21px 22px 13px}.bridge-card-head h2{font-size:19px;line-height:1.38;color:#174358;letter-spacing:-.018em;margin:7px 0 3px}
.bridge-count{font-size:11px;color:#577787;font-weight:750;letter-spacing:.06em}.bridge-zh{font-size:14px;font-weight:700;color:#304856;margin:5px 0}
.bridge-why{font-size:13px;line-height:1.55;color:#6d7981;margin:5px 0}
.bridge-items{border-top:1px solid #e6ebee}.bridge-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 20px;text-decoration:none;font-size:13px;line-height:1.5;color:#233d4a;border-bottom:1px solid #edf0f2}
.bridge-item:hover{background:#eff6f9}.bridge-item span:last-child{flex:none;color:#5e8290}
.bridge-read-all{display:block;padding:13px 20px;font-weight:750;text-decoration:none;color:#174e68;background:#f6f9fa;font-size:13px}
.bridge-foot{display:flex;justify-content:space-between;gap:12px;margin-top:24px;font-size:13px}.bridge-foot a{color:#38627b;text-decoration:none}
@media(max-width:760px){.bridge-grid{grid-template-columns:1fr}.bridge-card-head{padding:19px 17px 13px}.bridge-item{padding:11px 17px}.bridge-read-all{padding:13px 17px}}

<div id="app"></div>
<script>
const CLIENT_ID="57818954523-lfovhnonguj7nkq6hh030fs50lrmrouu.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive.readonly";
const TOKEN_KEY="hanami-kyoto-google-token-v3";
const CHAPTERS={
  "3":{fileId:"1dGsBY5l6XKuxkpriNDzx3tCmwIXQzS4Q",title:"Chapter 3｜線性迴歸",en:"Linear Regression"},
  "4":{fileId:"1fUhbSm_tOL4jnF9zHTEP99y71gYASDJG",title:"Chapter 4｜分類",en:"Classification"},
  "5":{fileId:"1JfsQ4Kfdr7TS8v5iTEGTEiZVxmw8a9zT",title:"Chapter 5｜重抽樣方法",en:"Resampling Methods"},
  "6":{fileId:"1ORIpJ-VNw8NGpNc_jAg79akwgkttw1FR",title:"Chapter 6｜線性模型選擇與正則化",en:"Linear Model Selection and Regularization"},
  "7":{fileId:"178tDYIkXotYcBkQjtYu0oOWJYqdP22At",title:"Chapter 7｜超越線性（選讀）",en:"Moving Beyond Linearity"},
  "8":{fileId:"1ROu_a2Os338NueAubKuVwWKVBua9YFCk",title:"Chapter 8｜樹狀方法",en:"Tree-Based Methods"},
  "9":{fileId:"18x58Woxao99wja3kN7Ntdfslx1CJDY7I",title:"Chapter 9｜支援向量機（選讀）",en:"Support Vector Machines"},
  "10":{fileId:"1QuEJYUNA27tCF6wAePGnVC6qI-3FohPe",title:"Chapter 10｜深度學習（選讀）",en:"Deep Learning"},
  "12":{fileId:"1-xzo8C-Tmm0jTJqNhhnAkF0iTRzkhibl",title:"Chapter 12｜非監督式學習",en:"Unsupervised Learning"}
};
const BRIDGE={"4":{"title":"Chapter 4 · Classification","zh":"分類與 GLM","why":"為 ATPA 的 GLM、GLMM 與二元分類建立模型基礎","sections":[["s431","4.3.1 The Logistic Model"],["s432","4.3.2 Estimating the Regression Coefficients"],["s433","4.3.3 Making Predictions"],["s434","4.3.4 Multiple Logistic Regression"],["s461","4.6.1 Linear Regression on the Bikeshare Data"],["s462","4.6.2 Poisson Regression on the Bikeshare Data"],["s463","4.6.3 Generalized Linear Models in Greater Generality"]]},"5":{"title":"Chapter 5 · Resampling Methods","zh":"交叉驗證","why":"為 ATPA 模型驗證、調參與 out-of-sample 評估建立基礎","sections":[["s511","5.1.1 The Validation Set Approach"],["s513","5.1.3 k-Fold Cross-Validation"],["s515","5.1.5 Cross-Validation on Classification Problems"]]},"6":{"title":"Chapter 6 · Linear Model Selection and Regularization","zh":"模型選擇與正則化","why":"為 ATPA 變數選擇、控制 overfitting 與 tuning 建立基礎","sections":[["s611","6.1.1 Best Subset Selection"],["s612","6.1.2 Stepwise Selection"],["s613","6.1.3 Choosing the Optimal Model"],["s621","6.2.1 Ridge Regression"],["s622","6.2.2 The Lasso"],["s623","6.2.3 Selecting the Tuning Parameter"]]},"8":{"title":"Chapter 8 · Tree-Based Methods","zh":"決策樹與集成方法","why":"為 ATPA Tree-based Model Comparison、Random Forest 與 SHAP 建立基礎","sections":[["s811","8.1.1 Regression Trees"],["s812","8.1.2 Classification Trees"],["s813","8.1.3 Trees Versus Linear Models"],["s814","8.1.4 Advantages and Disadvantages of Trees"],["s821","8.2.1 Bagging"],["s822","8.2.2 Random Forests"],["s823","8.2.3 Boosting"]]}};
let tokenClient=null;
let pendingChapter=null;
const app=document.getElementById("app");

function selector(){
document.title='ATPA 先備精華版';app.innerHTML='<main class="wrap bridge-home"><h1>ATPA 先備精華版</h1><div class="bridge-grid">'+Object.keys(BRIDGE).map(ch=>'<a class="bridge-card" href="?chapter='+ch+'"><h2>Chapter '+ch+'</h2></a>').join('')+'</div></main>';
}

function gate(ch){
  const c=CHAPTERS[ch];
  document.title=c.title+"｜ATPA 先備精華版";
  app.innerHTML=`<main class="gate"><section class="panel"><h1>Chapter ${ch}</h1><p id="message" hidden></p><button id="loginBtn" type="button" hidden>Google 登入</button><button id="switchBtn" type="button" hidden>切換帳號</button><div id="status" hidden></div></section></main>`;
}

function setStatus(text,loading=false){
  const el=document.getElementById("status"); if(!el)return;
  el.innerHTML=loading?'<span class="spinner"></span>'+text:text;
}
function showLogin(reason){
  const btn=document.getElementById("loginBtn");
  const msg=document.getElementById("message");
  if(btn){btn.hidden=false;btn.disabled=false}const switchBtn=document.getElementById("switchBtn");if(switchBtn)switchBtn.hidden=false;
  if(msg)msg.textContent="Google 授權只負責門禁；登入成功後，本章教材直接接管全頁。";
  setStatus(reason||"需要 Google 帳號授權。");
}
function saveToken(resp){
  const expiresIn=Number(resp.expires_in||3600);
  const payload={access_token:resp.access_token,expires_at:Date.now()+expiresIn*1000};
  sessionStorage.setItem(TOKEN_KEY,JSON.stringify(payload));
  return payload;
}
function getSavedToken(){
  try{
    const x=JSON.parse(sessionStorage.getItem(TOKEN_KEY)||"null");
    if(!x?.access_token||!x?.expires_at)return null;
    if(Date.now()>x.expires_at-120000){sessionStorage.removeItem(TOKEN_KEY);return null}
    return x;
  }catch{sessionStorage.removeItem(TOKEN_KEY);return null}
}

function addReadingTools(html,ch){
  // Shared language modes and pronunciation apply to every registered chapter.
  if(!CHAPTERS[ch])return html;
  const script='<scr'+'ipt src="/osaka2026/learning/english-us-tts.js?v=20261009-all-reading"></scr'+'ipt>'
    + '<scr'+'ipt src="/osaka2026/learning/islp-reading-mode.js?v=20261010-parallel"></scr'+'ipt>';
  // Preserve original source layout for chapters 4–6; public three-mode view overrides it.
  // Chapters 5 and 6 retain native inline SVG maths: each chapter has
  // its own opt-in overflow fix, so the original Drive HTML stays unchanged.
  const famLayoutChapters = new Set(['4','5','6']);
  const layout = famLayoutChapters.has(ch)
    ? '<link rel="stylesheet" href="/osaka2026/learning/islp-reading-fam-layout.css?v=20261010-ch4-pilot-v1">'
    : '';
  const chapterFix = ch === '5'
    ? '<link rel="stylesheet" href="/osaka2026/learning/islp-reading-ch05-fixes.css?v=20261011-ch5-v1">'
    : ch === '6'
      ? '<link rel="stylesheet" href="/osaka2026/learning/islp-reading-ch06-fixes.css?v=20261011-ch6-v1">'
      : '';
  // Isolated ATPA layout. All original private figures, tables, equations and text remain in Drive.
  const bridgeAssets='<link rel="stylesheet" href="/osaka2026/learning/atpa-prereq/reader.css?v=20261015-3views1">'
    + '<link rel="stylesheet" href="/osaka2026/learning/atpa-prereq/explainers.css?v=20261011-audit3">'
    + '<link rel="stylesheet" href="/osaka2026/learning/atpa-prereq/math-fix.css?v=20261011-math2">'
    + '<link rel="stylesheet" href="/osaka2026/learning/atpa-prereq/reading-layout.css?v=20261016-two-stage-overview1">'
    + (ch === '8' ? '<link rel="stylesheet" href="/osaka2026/learning/chinese-first-pilot.css?v=20261016-zh-first1">' : '')
    + (ch === '8' ? '<link rel="stylesheet" href="/osaka2026/learning/atpa-prereq/ch08-phone-reading.css?v=20261017-phone1">' : '')
    + '<scr'+'ipt defer src="/osaka2026/learning/atpa-prereq/reader.js?v=20261016-zh-first-ch8-1"></scr'+'ipt>'
    + '<scr'+'ipt defer src="/osaka2026/learning/atpa-prereq/explainers.js?v=20261011-audit3"></scr'+'ipt>'
    + '<scr'+'ipt defer src="/osaka2026/learning/atpa-prereq/math-fix.js?v=20261011-math2"></scr'+'ipt>';
  return /<\/body\s*>/i.test(html)
    ? html.replace(/<\/body\s*>/i,match=>script+layout+chapterFix+bridgeAssets+match)
    : html+script+layout+chapterFix+bridgeAssets;
}

function filterBridge(doc,ch){
 const c=BRIDGE[ch]; if(!c)return;
 const selected=new Set(c.sections.map(a=>a[0]));
 const parentIds={
  "4":new Set(["s43","s46"]),
  "5":new Set(["s51"]),
  "6":new Set(["s61","s62"]),
  "8":new Set(["s81","s82"])
 };
 if(ch==="4"){
  // Chapter 4 uses separate <section class="section"> containers; 4.6 subheadings lack ids.
  const target=doc.getElementById("s46");
  if(target){
   target.querySelectorAll("h3").forEach(h=>{
    const m=h.textContent.match(/^\s*4\.6\.([123])\s*[·.]/);
    if(m)h.id="s46"+m[1];
   });
  }
  doc.querySelectorAll("section.section[id]").forEach(section=>{
   if(!parentIds[ch].has(section.id)){section.remove();return}
   if(section.id==="s43"){
    let keep=true;
    [...section.children].forEach(el=>{
     if(/^H3$/.test(el.tagName)&&el.id&&/^s43\d/.test(el.id))keep=selected.has(el.id);
     if(!keep)el.remove();
    });
   }
  });
 } else {
  // Chapters 5, 6, 8 put h2, h3, equations, figures and paired paragraphs
  // as consecutive siblings. Keep every element between selected heading boundaries.
  const first=doc.getElementById(ch==="5"?"s51":ch==="6"?"s61":"s81");
  if(!first)throw new Error("MISSING_SECTION_START");
  const root=first.parentElement;
  let sawSection=false,keep=false;
  [...root.children].forEach(el=>{
   if(el.matches("h2.source-heading[id]")){
    sawSection=true;
    keep=parentIds[ch].has(el.id);
    if(!keep)el.remove();
    return;
   }
   if(el.matches("h3.source-heading[id]")){
    keep=selected.has(el.id);
    if(!keep)el.remove();
    return;
   }
   if(sawSection&&!keep)el.remove();
  });
 }
 // Remove stale links pointing to sections excluded from this private reader.
 const active=new Set([...selected,...parentIds[ch]]);
 doc.querySelectorAll('a[href^="#s"]').forEach(a=>{
  const id=a.getAttribute("href").slice(1);
  if(!active.has(id)){
   const li=a.closest("li");if(li&&li.contains(a)&&li.querySelectorAll("a").length===1)li.remove();else a.remove();
  }
 });
 // Readers retain the original source document and its private figures.
 const banner=doc.createElement("nav");
 banner.id="atpa-prereq-bar";
 banner.setAttribute("aria-label","ATPA 先備精華版導覽");
 const back=doc.createElement("a");back.href="./";back.textContent="← 23 小節目錄";
 const full=doc.createElement("a");full.href="../islp-reading/?chapter="+encodeURIComponent(ch);full.textContent="閱讀完整 Chapter →";
 banner.append(back,full);
 doc.body.insertBefore(banner,doc.body.firstChild);
 const style=doc.createElement("style");
 style.textContent="#atpa-prereq-bar{position:sticky;top:0;z-index:3000;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px clamp(12px,3vw,32px);background:rgba(251,253,255,.97);border-bottom:1px solid #dce3e9;box-shadow:0 2px 10px rgba(25,50,65,.06);font:600 13px/1.4 -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif}#atpa-prereq-bar a{color:#184d66;text-decoration:none}#atpa-prereq-bar a:last-child{text-align:right}h2[id],h3[id],section[id]{scroll-margin-top:66px}@media(max-width:390px){#atpa-prereq-bar{font-size:12px}}";
 doc.head.append(style);
}

function writeChapter(html,ch){
 const doc=new DOMParser().parseFromString(html,"text/html");
 const pairs=[...doc.querySelectorAll(".pair")];
 const bilingual=pairs.some(pair=>pair.querySelector(".original,.en-text")&&pair.querySelector(".translation,.zh-text"));
 if(!bilingual)throw new Error("NOT_BILINGUAL");
 filterBridge(doc,ch);
 const safeHTML="<!doctype html>\n"+doc.documentElement.outerHTML;
 document.open();document.write(addReadingTools(safeHTML,ch));document.close();
 if(location.hash){
  const id=decodeURIComponent(location.hash.slice(1));
  setTimeout(()=>document.getElementById(id)?.scrollIntoView({block:"start"}),200);
 }
}
function showContentError(error){
  if(error?.message!=='NOT_BILINGUAL')return false;
  const message=document.getElementById('message');
  if(message)message.textContent='本章教材缺少逐段英文與繁中對照，請更新正確的雙語教材後再開啟。';
  const login=document.getElementById('loginBtn');
  const switchAccount=document.getElementById('switchBtn');
  if(login)login.hidden=true;
  if(switchAccount)switchAccount.hidden=true;
  setStatus('教材版本不符合雙語閱讀格式。');
  return true;
}

async function fetchChapter(accessToken,ch){
  const c=CHAPTERS[ch];
  setStatus("正在下載 "+c.title+"…",true);
  const res=await fetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(c.fileId)+"?alt=media",{
    headers:{Authorization:"Bearer "+accessToken},cache:"no-store"
  });
  if(res.status===401){sessionStorage.removeItem(TOKEN_KEY);throw new Error("TOKEN_EXPIRED")}
  if(!res.ok)throw new Error("DRIVE_"+res.status);

  const total=Number(res.headers.get("content-length")||0);
  if(!res.body||!total){
    const html=await res.text();
    writeChapter(html,ch);return;
  }
  const reader=res.body.getReader(),chunks=[];let received=0;
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    chunks.push(value);received+=value.length;
    setStatus("正在下載 "+c.title+" · "+Math.min(99,Math.round(received/total*100))+"%",true);
  }
  const blob=new Blob(chunks,{type:"text/html;charset=utf-8"});
  const html=await blob.text();
  writeChapter(html,ch);
}
function initClient(){
  if(tokenClient||!window.google?.accounts?.oauth2)return !!tokenClient;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPE,
    callback:async resp=>{
      if(resp.error){showLogin("Google 尚未完成授權。");return}
      try{const t=saveToken(resp);await window.HanamiAuth?.remember(t.access_token);await fetchChapter(t.access_token,pendingChapter)}
      catch(e){if(showContentError(e))return;sessionStorage.removeItem(TOKEN_KEY);showLogin(e?.message==="TOKEN_EXPIRED"?"登入狀態已過期，請再按一次。":"私人教材載入失敗，請再試一次。")}
    },
    error_callback:()=>showLogin("瀏覽器需要你按一次登入按鈕。")
  });
  return true;
}
function requestQuiet(switchAccount=false){
  if(!initClient())return false;
  try{(window.HanamiAuth?window.HanamiAuth.request(tokenClient,switchAccount):tokenClient.requestAccessToken({prompt:switchAccount?'select_account':''}));return true}catch{return false}
}
async function openChapter(ch){
  pendingChapter=ch;gate(ch);
  const saved=getSavedToken();
  if(saved){
    try{await window.HanamiAuth?.remember(saved.access_token);await fetchChapter(saved.access_token,ch);return}
    catch(e){if(showContentError(e))return;sessionStorage.removeItem(TOKEN_KEY)}
  }
  const deadline=Date.now()+6000;
  while(Date.now()<deadline&&!window.google?.accounts?.oauth2)await new Promise(r=>setTimeout(r,100));
  if(!initClient()){showLogin("Google 登入元件載入失敗，請重新整理。");return}
  setStatus("正在嘗試沿用既有 Google 授權…",true);
  if(!requestQuiet())showLogin("請按一次 Google 登入。");
  setTimeout(()=>{
    const btn=document.getElementById("loginBtn");
    if(btn&&btn.hidden)showLogin("若沒有自動開啟，請按一次 Google 登入。");
  },3500);
}
document.addEventListener("click",e=>{
  if(e.target?.id==="loginBtn"){
    e.target.disabled=true;setStatus("正在確認 Google 帳號…",true);
    if(!requestQuiet())showLogin("無法啟動 Google 授權，請重新整理後再試。");
  }
});
document.addEventListener("click",e=>{if(e.target?.id==="switchBtn"){sessionStorage.removeItem(TOKEN_KEY);window.HanamiAuth?.forget();const btn=document.getElementById("loginBtn");if(btn)btn.disabled=true;setStatus("正在切換 Google 帳號…",true);if(!requestQuiet(true))showLogin("請按一次 Google 登入。")}});
const ch=new URLSearchParams(location.search).get("chapter");
if(BRIDGE[ch])openChapter(ch);else selector();
</script>
