<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>私人學習入口</title>
<style>
:root{--bg:#f5f7f9;--card:#fff;--text:#1d2731;--muted:#68737f;--line:#dfe5ea;--accent:#1f5d84;--accent2:#173e5b;--shadow:0 14px 36px rgba(27,47,62,.08)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
body{background:linear-gradient(180deg,#eaf2f7 0,#f5f7f9 360px)}
.wrap{max-width:920px;margin:auto;padding:clamp(28px,7vw,72px) 16px 56px}
.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;color:var(--accent)}
h1{font-size:clamp(34px,7vw,54px);line-height:1.08;letter-spacing:-.045em;margin:8px 0 10px;color:var(--accent2)}
.lead{margin:0;color:var(--muted);font-size:15px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:30px}
.entry{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);color:inherit;transition:transform .15s ease,box-shadow .15s ease}
.entry:hover{transform:translateY(-1px)}.entry:active{transform:scale(.99)}
.entry .tag{font-size:11px;font-weight:850;letter-spacing:.1em;color:var(--accent)}
.entry h2{font-size:24px;letter-spacing:-.025em;color:var(--accent2);margin:8px 0 7px}
.entry p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.arrow{display:block;margin-top:20px;color:var(--accent);font-weight:850}
@media(max-width:620px){.wrap{padding:26px 12px 40px}.entry{border-radius:18px;padding:19px}}
</style>
</head>
<body>
