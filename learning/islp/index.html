<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light">
<title>ISLP 精讀｜私人學習</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--text:#1f2933;--muted:#66737f;--line:#dfe5ea;--blue:#1f5d84;--navy:#173e5b;--shadow:0 12px 32px rgba(30,50,65,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{background:linear-gradient(180deg,#eaf2f7 0,#f6f7f8 360px)}
.wrap{max-width:980px;margin:auto;padding:clamp(28px,6vw,64px) 16px 54px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;color:var(--blue)}
h1{font-size:clamp(34px,7vw,54px);letter-spacing:-.045em;line-height:1.08;margin:8px 0 10px;color:var(--navy)}.lead{margin:0;color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:30px}.card{display:block;text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow);color:inherit}
.card:active{transform:scale(.99)}.num{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--blue)}h2{font-size:25px;margin:8px 0 4px;color:var(--navy);letter-spacing:-.025em}.en{font-weight:700;color:#445866}
.desc{font-size:14px;line-height:1.65;color:var(--muted);margin:12px 0 0}.topics{font-size:12px;line-height:1.7;color:#53616d;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.open{display:block;margin-top:18px;font-weight:850;color:var(--blue)}
.back{display:inline-block;margin-top:26px;color:var(--muted);font-size:13px;text-decoration:none}@media(max-width:620px){.wrap{padding:25px 12px 38px}.card{border-radius:18px;padding:19px}}
</style>
</head>
<body><main class="wrap"><h1>ISLP 精讀</h1><section class="grid"><a class="card" href="./ch03/"><h2>Chapter 3</h2></a><a class="card" href="./ch04/"><h2>Chapter 4</h2></a></section></main></body></html>
