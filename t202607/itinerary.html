.daynav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.datebtn{line-height:1.25}.datebtn span{display:block;font-size:10px;color:inherit;opacity:.75}.datebtn b{display:block;font-size:14px}.date-hero{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2px solid #e6d3b7;border-radius:18px;padding:14px;margin:14px 0 8px}.date-hero h2{border:0;margin:0;padding:0}.date-chip{min-width:58px;text-align:center;background:#5c3e21;color:#fff;border-radius:16px;padding:10px 6px;font-weight:900;font-size:20px}.day-section{scroll-margin-top:128px}.day-section.is-active .date-hero{border-color:#5c3e21;box-shadow:0 0 0 3px #5c3e2120}.step{border-top:1px solid #f0e6d6;padding:14px 0}.step:first-child{border-top:0}.step b{display:block;color:#704e2e;font-size:16px;margin:3px 0 6px}.time{font-weight:900;color:#5c3e21}.why{font-size:13px;line-height:1.65;color:#4f4840;margin:6px 0}.route{font-size:12px;line-height:1.8}.route span{display:inline-block;background:#faf6f0;border:1px solid #ebe3d5;border-radius:999px;padding:4px 8px;margin:3px;color:#5c554e}.dest{display:block;width:max-content;max-width:100%;margin-top:8px;background:#5c3e21!important;color:#fff!important;border-color:#5c3e21!important}.local{background:#eaf7ef;color:#26734d}.cols{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:520px){.cols{grid-template-columns:1fr 1fr}}
