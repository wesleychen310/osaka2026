function link(name){return `<a class="pill" target="_blank" href="${map(name)}">📍 ${name}</a>`}
function favBtn(id){return `<button onclick="toggleFav('${id}')">${fav.includes(id)?'❤️':'🤍'}</button>`}
function card(a,id){let near=(a[2]||'').includes('飯店');return `<div class="card p-4"><div class="flex justify-between gap-2"><div class="flex flex-wrap gap-1"><span class="tag">${a[1]}</span><span class="tag ${near?'near':''}">${a[2]}</span></div>${favBtn(id)}</div><h4 class="text-sm font-black mt-2">${a[3]}</h4><p class="text-[11px] text-gray-500 mt-1 leading-relaxed">${a[4]}</p><div class="flex justify-end mt-2">${link(a[3])}</div></div>`}
function groupPage(key){let [title,lead,data]=cats[key],groups=[...new Set(data.map(x=>x[0]))];return `<section class="space-y-4"><div class="card p-5"><span class="text-[10px] font-bold text-[#8C6239] bg-[#FAF6F0] px-2 py-0.5 rounded-full">${title}</span><p class="text-xs text-[#5C4F43] leading-relaxed mt-2">${lead}</p></div>${groups.map(g=>`<div class="divider">${g}</div><div class="space-y-3">${data.filter(x=>x[0]===g).map((x,i)=>card(x,key+g+i)).join('')}</div>`).join('')}</section>`}
function dayPage(d){return `<section class="space-y-4"><div class="card p-5"><span class="text-[10px] font-bold text-[#8C6239] bg-[#FAF6F0] px-2 py-0.5 rounded-full">${d[1]}</span><p class="text-xs text-[#5C554E] mt-2">${d[0]}</p></div><div class="space-y-3">${d[2].map((it,i)=>`<div class="card p-4"><div class="text-xs font-black text-[#8C6239]">${it[0]}</div><h4 class="text-sm font-bold mt-1">${it[1]}</h4><p class="text-xs text-gray-500 mt-1">${it[2]}</p><div class="flex flex-wrap gap-1 mt-2">${it[3].map(link).join('')}</div></div>`).join('')}</div></section>`}

function switchTab(id){current=id;document.querySelectorAll('[id^=tab-]').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+id)?.classList.add('active');app.innerHTML=days[id]?dayPage(days[id]):groupPage(id);window.scrollTo({top:0,behavior:'smooth'})}
function toggleFav(id){let i=fav.indexOf(id);i>-1?fav.splice(i,1):fav.push(id);localStorage.setItem(favKey,JSON.stringify(fav));switchTab(current)}
