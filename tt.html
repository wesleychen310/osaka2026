function link(name){return `<a class="pill" target="_blank" href="${map(name)}">📍 ${name}</a>`}function favBtn(id){return `<button onclick="toggleFav('${id}')" class="text-base">${fav.includes(id)?'❤️':'🤍'}</button>`}
function itemCard(arr,id){return `<div class="card p-4"><div class="flex justify-between items-start gap-2"><span class="text-[10px] font-black text-[#8C6239] bg-[#F0E6D6] px-2 py-0.5 rounded-full">${arr[0]}</span>${favBtn(id)}</div><h4 class="text-sm font-black mt-2">${arr[1]}</h4><p class="text-[11px] text-gray-500 mt-1 leading-relaxed">${arr[2]}</p><div class="flex justify-end mt-2">${link(arr[1])}</div></div>`}
function dayPage(d){return `<section class="space-y-4"><div class="card p-5"><span class="text-[10px] font-bold text-[#8C6239] bg-[#FAF6F0] px-2 py-0.5 rounded-full">${d.title}</span><p class="text-xs text-[#5C554E] leading-relaxed mt-2.5 font-medium">${d.lead}</p></div><div class="card p-5 space-y-6 relative timeline">${d.items.map(it=>`<div class="flex items-start gap-4 relative z-10"><div class="w-10 h-10 rounded-full bg-[#FAF6F0] border-2 border-[#8C6239] flex items-center justify-center text-xs font-bold shrink-0">${it[0]}</div><div class="flex-1"><div class="text-xs font-black text-[#8C6239]">${it[1]}</div><h4 class="text-sm font-bold mt-0.5">${it[2]}</h4><p class="text-xs text-gray-500 mt-1">${it[3]}</p><div class="flex flex-wrap gap-1 mt-2">${it[4].map(link).join('')}</div></div></div>`).join('')}</div>${d.extra?`<div class="card p-5"><h3 class="text-sm font-black text-[#704E2E] mb-3">💡 奈良備選</h3><div class="grid grid-cols-2 gap-2">${d.extra.map(x=>`<a target="_blank" href="${map(x)}" class="bg-[#FAF6F0] hover:bg-[#F0E6D6] border border-[#EBE3D5] p-2.5 rounded-xl text-xs font-bold text-gray-700">📍 ${x}</a>`).join('')}</div></div>`:''}</section>`}
function listPage(title,lead,data,prefix){return `<section class="space-y-4"><div class="card p-5"><span class="text-[10px] font-bold text-[#8C6239] bg-[#FAF6F0] px-2 py-0.5 rounded-full">${title}</span><p class="text-xs text-[#5C4F43] leading-relaxed mt-2">${lead}</p></div><div class="space-y-3">${data.map((x,i)=>itemCard(x,prefix+i)).join('')}</div>${prefix==='nearby'?'<div class="card p-5 text-xs text-gray-600 leading-relaxed"><b class="text-[#704E2E]">最省力組合：</b>白天大丸／高島屋，晚上先斗町或四條大橋一帶。懶得跑遠就直接吃大丸 8F 或 B1。</div>':''}</section>`}
function renderTabs(){dayTabs.innerHTML=Object.entries(days).map(([k,v])=>`<button id="tab-${k}" onclick="switchTab('${k}')" class="py-2 rounded-xl text-[11px] font-black bg-white text-[#8C8275] border border-[#EBE3D5]">${v.label}</button>`).join('');moreTabs.innerHTML=[['dept','🏬 百貨'],['cafe','☕ 洋館'],['backups','🎒 備選'],['nearby','🍽️ 周邊']].map(x=>`<button id="tab-${x[0]}" onclick="switchTab('${x[0]}')" class="py-2 rounded-xl text-[11px] font-black bg-white text-[#8C8275] border border-[#EBE3D5]">${x[1]}</button>`).join('')}
function switchTab(id){current=id;document.querySelectorAll('[id^=tab-]').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+id)?.classList.add('active');let html=days[id]?dayPage(days[id]):id==='dept'?listPage('🏬 百貨美食','京都高島屋 S.C. 與大丸京都店名店清單。',dept,'dept'):id==='cafe'?listPage('☕ 古蹟咖啡・洋館餐廳','明治、大正與昭和風華的喫茶店、洋食館與近代建築。',cafes,'cafe'):id==='nearby'?listPage('🍽️ 宜必思京都四條周邊','以四條烏丸、大丸京都店、高島屋、錦市場、河原町為主。按店名可直接開 Google 地圖。',nearby,'nearby'):listPage('🎒 經典備選','不在主行程內，但值得保留的餐廳與伴手禮。',backups,'backup');app.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}
function toggleFav(id){let i=fav.indexOf(id);if(i>-1){fav.splice(i,1);showToast('🤍 已取消收藏')}else{fav.push(id);showToast('❤️ 已加入我的最愛')}localStorage.setItem('kyoto_favs_v3',JSON.stringify(fav));switchTab(current)}
function toggleToolbox(){toolbox.classList.toggle('hidden')}function convertCurrency(s){let r=4.8,t=twdInput,j=jpyInput;if(s==='twd')j.value=Math.round((parseFloat(t.value)||0)*r);else t.value=Math.round((parseFloat(j.value)||0)/r)}function saveNotes(){localStorage.setItem('kyoto_notes',travelNotes.value)}function clearNotes(){travelNotes.value='';localStorage.removeItem('kyoto_notes');showToast('📝 筆記已清空')}function showToast(m){toast.textContent=m;toast.classList.remove('opacity-0','pointer-events-none');toast.classList.add('opacity-100');setTimeout(()=>{toast.classList.remove('opacity-100');toast.classList.add('opacity-0','pointer-events-none')},1500)}
window.onload=()=>{renderTabs();travelNotes.value=localStorage.getItem('kyoto_notes')||'';switchTab('day1')};
</script>
</body>
</html>
