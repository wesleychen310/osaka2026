<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>小記事｜私人 Google Drive 整合記事</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/osaka2026/private-auth-hint.js"></script>
<style>
:root{--ink:#233745;--muted:#697b84;--teal:#14776e;--border:#dfe8e8}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:#f5f7f8;color:var(--ink)}
.top{height:50px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(14px,calc((100vw - 1160px)/2))}
.brand{font-size:13px;font-weight:750;color:#46616a}.switch{font:inherit;font-size:12px;color:var(--teal);border:0;background:transparent;cursor:pointer;padding:9px}
.gate{background:#fff;border:1px solid var(--border);border-radius:14px;max-width:500px;margin:65px auto;padding:30px 26px}
.gate h1{font-size:27px;margin:0 0 9px}.gate p{color:var(--muted);font-size:14px;line-height:1.8}
.login{padding:12px 21px;border:0;border-radius:9px;background:#176d64;color:#fff;font:inherit;font-weight:700;cursor:pointer}
#status{color:var(--muted);font-size:12px;margin:12px 0;line-height:1.7}
#viewer{background:#f5f7f8}
#privateFrame{display:block;border:0;width:100%;min-height:700px;background:transparent}
@media(max-width:600px){.gate{margin:22px 12px;padding:24px 18px}.top{height:44px}}
</style>
</head>
<body>
<header class="top"><div class="brand">小記事 · Google Drive 私人內容</div><button id="switchBtn" type="button" class="switch">切換 Google 帳號</button></header>
<main>
<section id="gate" class="gate"><h1>私人小記事</h1><p>登入具有私人 Google Drive 檔案存取權限的帳號，即可閱讀財務、所得、信託股票與隱形眼鏡更換紀錄。公開網站不儲存記事內容。</p><button id="loginBtn" class="login" type="button">使用 Google 登入</button></section>
<section id="viewer" hidden><iframe id="privateFrame" title="私人小記事整合全文" referrerpolicy="no-referrer" scrolling="no"></iframe></section>
<p id="status" role="status" aria-live="polite" style="text-align:center">正在確認登入狀態…</p>
</main>
<script src="/osaka2026/records/app.js?v=20261018-unified" defer></script>
</body></html>
