<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>私人記事｜財務・所得</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/osaka2026/private-auth-hint.js"></script>
<style>
:root{--bg:#f6f7f7;--paper:#fff;--ink:#263843;--sub:#677882;--line:#dbe3e6;--teal:#116f68}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
.wrap{max-width:960px;margin:auto;padding:0 18px}
header{background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:23px;padding-bottom:18px}
h1{font-size:28px;font-weight:760;letter-spacing:-.035em;margin:0}
.sub{color:var(--sub);font-size:13px;margin:5px 0 0}
.settings{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;color:var(--sub);font-size:12px;cursor:pointer}
.tabs{display:flex;gap:28px;border-top:1px solid var(--line)}
.tab{appearance:none;border:none;border-bottom:3px solid transparent;background:none;color:var(--sub);font:inherit;padding:17px 2px 13px;font-size:15px;cursor:pointer;font-weight:600}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}
main{padding-top:22px;padding-bottom:48px}
.gate{background:white;border:1px solid var(--line);padding:34px 22px;border-radius:10px;max-width:560px;margin:20px auto}
.gate h2{font-size:19px;margin:0 0 12px}
p{line-height:1.75;color:var(--sub);font-size:13px}
button.primary{border:0;background:#185c58;border-radius:8px;color:white;font:inherit;font-weight:700;font-size:14px;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.5}
.status{color:var(--sub);font-size:12px;margin:12px 0}
#privateFrame{width:100%;display:block;border:0;min-height:450px;background:transparent}
@media(max-width:600px){.wrap{padding-left:12px;padding-right:12px}.top{padding-top:18px;padding-bottom:14px}h1{font-size:24px}.tabs{gap:30px}.gate{padding:24px 18px;margin:12px auto}}
</style>
</head>
<body>
<header>
 <div class="wrap top">
   <div><h1>私人記事</h1><p class="sub">2026 年｜財務與所得</p></div>
   <button id="switchBtn" class="settings" type="button">切換 Google 帳號</button>
 </div>
 <nav class="wrap tabs" role="tablist" aria-label="私人紀錄分類">
   <button class="tab active" data-tab="finance" role="tab" aria-selected="true" type="button">支出紀錄</button>
   <button class="tab" data-tab="income" role="tab" aria-selected="false" type="button">所得紀錄</button>
 </nav>
</header>
<main class="wrap">
 <div id="gate" class="gate">
   <h2>登入私人記事</h2>
   <p>使用有權限的 Google 帳號查看財務與所得紀錄。</p>
   <button id="loginBtn" class="primary" type="button">使用 Google 登入</button>
 </div>
 <div id="viewer" hidden><iframe id="privateFrame" title="私人記事內容" scrolling="no" referrerpolicy="no-referrer"></iframe></div>
 <p id="status" class="status" role="status" aria-live="polite">正在檢查登入狀態…</p>
</main>
<script src="/osaka2026/records/app.js" defer></script>
</body>
</html>
